; =============================================================================
; BikeBoss Firmware — PlatformIO Configuration
; Target: Seeed Studio XIAO ESP32-S3
; =============================================================================

[platformio]
; Keep a plain `pio run` reproducible. Release and OTA upload environments need
; explicit version/build or target-host environment variables and are invoked
; directly by the release/upload workflows.
default_envs =
    seeed_xiao_esp32s3
    seeed_xiao_esp32s3_signed
    seeed_xiao_esp32s3_signed_cellular
    seeed_xiao_esp32s3_signed_wifi_local
    seeed_xiao_esp32s3_staging
    seeed_xiao_esp32s3_staging_signed

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; ---------------------------------------------------------------------------
; Build & Upload
; ---------------------------------------------------------------------------
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; ---------------------------------------------------------------------------
; Library Dependencies
; ---------------------------------------------------------------------------
lib_deps =
    ; MPU6050 6-axis IMU driver (I2C)
    electroniccats/MPU6050@^1.3.0
    ; ArduinoJson — structured JSON payloads for telemetry
    bblanchon/ArduinoJson@^7.0.0
    ; TinyGSM — lightweight async AT modem driver (SIMCom A7670E compatible)
    vshymanskyy/TinyGSM@^0.12.0
    ; StreamDebug — non-blocking log output (optional dev helper)
    vshymanskyy/StreamDebugger@^1.0.0

; ---------------------------------------------------------------------------
; Build Flags — tighten C++ warnings, enable C++17
; ---------------------------------------------------------------------------
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; ---------------------------------------------------------------------------
; Debug configuration (optional)
; ---------------------------------------------------------------------------
debug_tool = esp-builtin
debug_init_break = tbreak setup

[env:seeed_xiao_esp32s3_signed]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DUSE_SIGNED_TELEMETRY_V2=1

[env:seeed_xiao_esp32s3_signed_cellular]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DUSE_SIGNED_TELEMETRY_V2=1
    -DUSE_WIFI_UPLINK=0

[env:seeed_xiao_esp32s3_signed_wifi_local]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DUSE_SIGNED_TELEMETRY_V2=1
    -DCLOUD_SCHEME=\"http\"
    -DCLOUD_HOST=\"${sysenv.BIKEBOSS_LOCAL_TEST_HOST}\"
    ; Public fixture used only by the isolated LAN receiver, never production.
    -DDEVICE_SIGNING_KEY_HEX=\"000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f\"

[env:seeed_xiao_esp32s3_staging]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DCLOUD_HOST=\"bikeboss-api-staging.sokpanha-nov1999.workers.dev\"
    -DUSE_WIFI_UPLINK=1
    -DBATTERY_SENSE_ENABLED=0
    -DWIFI_NETWORK_LABEL=\"farm_kafe\"
    ; Responsive phone field testing: two geofence samples confirm in ~5-10s.
    -DHEARTBEAT_INTERVAL_MS=5000UL
    -DHEARTBEAT_MAX_INTERVAL_MS=5000UL

[env:seeed_xiao_esp32s3_staging_signed]
extends = env:seeed_xiao_esp32s3_staging
build_flags =
    ${env:seeed_xiao_esp32s3_staging.build_flags}
    -DUSE_SIGNED_TELEMETRY_V2=1

[env:seeed_xiao_esp32s3_staging_signed_release]
extends = env:seeed_xiao_esp32s3_staging_signed
build_flags =
    ${env:seeed_xiao_esp32s3_staging_signed.build_flags}
    -DFIRMWARE_VERSION=\"${sysenv.BIKEBOSS_FIRMWARE_VERSION}\"
    -DFIRMWARE_BUILD=${sysenv.BIKEBOSS_FIRMWARE_BUILD}UL

[env:seeed_xiao_esp32s3_staging_signed_ota]
extends = env:seeed_xiao_esp32s3_staging_signed
upload_protocol = espota
upload_port = ${sysenv.BIKEBOSS_OTA_HOST}
upload_flags =
    --auth=${sysenv.BIKEBOSS_OTA_PASSWORD}
