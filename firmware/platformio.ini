; =============================================================================
; BikeBoss Firmware — PlatformIO Configuration
; Target: Seeed Studio XIAO ESP32-S3
; =============================================================================

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; ---------------------------------------------------------------------------
; Build & Upload
; ---------------------------------------------------------------------------
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; ---------------------------------------------------------------------------
; Library Dependencies
; ---------------------------------------------------------------------------
lib_deps =
    ; MPU6050 6-axis IMU driver (I2C)
    electroniccats/MPU6050@^1.3.0
    ; ArduinoJson — structured JSON payloads for telemetry
    bblanchon/ArduinoJson@^7.0.0
    ; TinyGSM — lightweight async AT modem driver (SIMCom A7670E compatible)
    tinygsmgroup/TinyGSM@^0.12.0
    ; StreamDebug — non-blocking log output (optional dev helper)
    vshymanskyy/StreamDebugger@^1.0.0

; ---------------------------------------------------------------------------
; Build Flags — tighten C++ warnings, enable C++17
; ---------------------------------------------------------------------------
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; ---------------------------------------------------------------------------
; Debug configuration (optional)
; ---------------------------------------------------------------------------
debug_tool = esp-builtin
debug_init_break = tbreak setup