# =============================================================================
# BikeBoss Backend — Cloudflare Wrangler Configuration
# =============================================================================

name = "bikeboss-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ---------------------------------------------------------------------------
# D1 Database Binding
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "bikeboss-db"
database_id = "PLACEHOLDER_D1_DATABASE_ID"

# ---------------------------------------------------------------------------
# Environment Variables
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Secrets (set via `wrangler secret put <NAME>` — never commit real values):
#   TELEGRAM_BOT_TOKEN
#   ABA_PAYWAY_MERCHANT_ID
#   ABA_PAYWAY_API_KEY
# ---------------------------------------------------------------------------
[vars]
ABA_PAYWAY_API_URL = "https://payway.ababank.com/api"
GEOFENCE_DEFAULT_RADIUS_M = 100
HEARTBEAT_TIMEOUT_MS = 600000

# ---------------------------------------------------------------------------
# Cron Triggers
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/5 * * * *", "0 9 * * *"]

# ---------------------------------------------------------------------------
# Routes (optional — custom domain)
# ---------------------------------------------------------------------------
# [[routes]]
# pattern = "api.bikeboss.io/*"
# zone_name = "bikeboss.io"

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1.0