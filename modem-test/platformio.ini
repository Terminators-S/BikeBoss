; =============================================================================
; LilyGo T-A7670G Standalone Modem Test (USB <-> Modem UART passthrough)
; Board: LilyGo T-A7670G (ESP32 classic + SIMCom A7670G on one PCB)
; =============================================================================

[env:T-A7670]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_RUNNING_CORE=1
